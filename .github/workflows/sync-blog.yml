name: Sync blog RSS

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [blog-published]

concurrency:
  group: sync-blog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rss:sync
      - run: pnpm content:validate
      - name: Commit only when posts changed
        id: diff
        run: |
          if git diff --quiet data/blog-posts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "sumery-bot"
          git config user.email "bot@sumery.cn"
          git add data/blog-posts.json
          git commit -m "chore(rss): sync blog posts [skip ci]"
          git push
