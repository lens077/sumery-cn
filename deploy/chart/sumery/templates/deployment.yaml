{{- $name := "sumery-web" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sumery.labels" . | nindent 4 }}
    {{- include "sumery.selector" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "sumery.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sumery.selector" . | nindent 8 }}
      annotations:
        # 只改 nginx 配置、镜像不变时也要滚动重启，nginx 不会自己重读挂载的文件
        checksum/nginx: {{ .Files.Get "files/nginx.conf" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.web.runAsUser }}
        runAsGroup: {{ .Values.web.runAsGroup }}
        fsGroup: {{ .Values.web.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "sumery.selector" . | nindent 14 }}
      containers:
        - name: nginx
          image: {{ include "sumery.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: health, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          # 摘除 endpoint 与 nginx 退出之间留出时间，滚动更新不丢请求
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d, readOnly: true }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run/nginx }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ $name }}-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
