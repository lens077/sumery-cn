{{- if .Values.route.enabled -}}
{{- $gw := .Values.route.gateway -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sumery
  labels:
    {{- include "sumery.labels" . | nindent 4 }}
spec:
  hostnames:
{{- range .Values.route.hosts }}
    - {{ . | quote }}
{{- end }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gw.name }}
      namespace: {{ $gw.namespace }}
      sectionName: {{ $gw.httpsSection }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: sumery-web
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end -}}
