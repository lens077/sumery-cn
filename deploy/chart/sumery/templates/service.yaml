{{- $name := "sumery-web" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sumery.labels" . | nindent 4 }}
    {{- include "sumery.selector" . | nindent 4 }}
spec:
  selector:
    {{- include "sumery.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
